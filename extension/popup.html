<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>DOM Hints</h1>

  <div class="inject-row">
    <button id="inject-btn" class="btn primary">Inject Code</button>
    <button id="dropdown-toggle" class="btn primary toggle">&#9662;</button>
    <div id="dropdown-menu" class="dropdown hidden">
      <button id="auto-hour">Auto-inject on <span class="domain-label"></span> (1 hour)</button>
      <button id="auto-always">Auto-inject on <span class="domain-label"></span> (always)</button>
    </div>
  </div>
  <div id="status" class="status"></div>

  <hr>

  <label>Log prefix
    <input id="prefix" type="text" value="dom-hint:" spellcheck="false">
  </label>

  <fieldset>
    <legend>Activation</legend>
    <label class="sub-label">Modifiers + click</label>
    <div class="inline-group">
      <label><input type="checkbox" id="mod-ctrl" checked> <span class="mod-label" data-mod="ctrl">Ctrl</span></label>
      <label><input type="checkbox" id="mod-alt" checked> <span class="mod-label" data-mod="alt">Alt</span></label>
      <label><input type="checkbox" id="mod-shift"> <span class="mod-label" data-mod="shift">Shift</span></label>
      <label><input type="checkbox" id="mod-meta"> <span class="mod-label" data-mod="meta">Meta</span></label>
    </div>
    <label><input type="checkbox" id="act-toggle"> Toggle mode (click on, click off)</label>
    <label><input type="checkbox" id="act-indicator" checked> Show on-page indicator</label>
    <label><input type="checkbox" id="act-autostart"> Start on page load</label>
  </fieldset>

  <fieldset>
    <legend>Track mutations</legend>
    <label><input type="checkbox" id="mut-childlist" checked> Element inserts &amp; deletes</label>
    <label><input type="checkbox" id="mut-attributes"> Attribute changes</label>
    <label><input type="checkbox" id="mut-characterdata"> Text changes</label>
  </fieldset>

  <fieldset>
    <legend>Trigger attribution</legend>
    <label><input type="checkbox" id="trig-network" checked> Track fetch/XHR</label>
    <label><input type="checkbox" id="trig-timers"> Patch timers (invasive)</label>
  </fieldset>

  <fieldset>
    <legend>Observe scope</legend>
    <label><input type="checkbox" id="scope-head"> Include &lt;head&gt;</label>
    <label><input type="checkbox" id="scope-shadow"> Shadow DOM roots</label>
    <label><input type="checkbox" id="scope-iframes"> Include iframes</label>
  </fieldset>

  <fieldset>
    <legend>Output</legend>
    <label><input type="checkbox" id="opt-grouped" checked> Group details (collapsed)</label>
    <label>Max HTML length
      <input id="opt-maxhtml" type="number" min="0" max="10000" step="50" value="200">
    </label>
    <label>Selector filter
      <input id="opt-selector" type="text" placeholder="e.g. .my-component, #app" spellcheck="false">
    </label>
    <label>Ignore list
      <input id="opt-ignore" type="text" placeholder="e.g. .cursor-blink, .animation" spellcheck="false">
    </label>
    <label>Debounce (ms)
      <input id="opt-debounce" type="number" min="0" max="5000" step="10" value="0">
    </label>
    <label><input type="checkbox" id="opt-record"> Record session log</label>
  </fieldset>

  <fieldset id="log-section" class="hidden">
    <legend>Session log</legend>
    <div class="log-controls">
      <span id="log-count">0 entries</span>
      <button id="log-export" class="btn small">Export JSON</button>
      <button id="log-clear" class="btn small">Clear</button>
    </div>
  </fieldset>

  <a id="options-link" href="#">Edit auto-inject domains</a>

  <script src="popup.js"></script>
</body>
</html>
