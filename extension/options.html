<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>DOM Hints &mdash; Auto-Inject Domains</h1>

  <table id="domain-table">
    <thead>
      <tr>
        <th>Domain</th>
        <th>Mode</th>
        <th>Expires</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="domain-list"></tbody>
  </table>

  <p id="empty-msg">No auto-inject domains configured.</p>

  <div class="add-row">
    <input id="new-domain" type="text" placeholder="example.com">
    <select id="new-mode">
      <option value="always">Always</option>
      <option value="1hour">1 hour</option>
    </select>
    <button id="add-btn">Add</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
