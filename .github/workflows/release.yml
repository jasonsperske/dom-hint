name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changesets
        id: changesets
        run: |
          CHANGESET_FILES=$(find .changeset -name '*.md' ! -name 'README.md' -type f)
          if [ -z "$CHANGESET_FILES" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No changeset files found — skipping version bump"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"

            # Determine the highest bump level across all changeset files
            BUMP="patch"
            for f in $CHANGESET_FILES; do
              FILE_BUMP=$(sed -n 's/^bump: *//p' "$f" | tr -d '[:space:]')
              if [ "$FILE_BUMP" = "major" ]; then
                BUMP="major"
              elif [ "$FILE_BUMP" = "minor" ] && [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            done

            echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            echo "Bump level: $BUMP"
          fi

      - name: Bump version
        if: steps.changesets.outputs.found == 'true'
        id: version
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BUMP="${{ steps.changesets.outputs.bump }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT → $NEW_VERSION"

      - name: Update manifest.json version
        if: steps.changesets.outputs.found == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' extension/manifest.json > tmp.json
          mv tmp.json extension/manifest.json

      - name: Collect changeset notes
        if: steps.changesets.outputs.found == 'true'
        id: notes
        run: |
          NOTES=""
          for f in $(find .changeset -name '*.md' ! -name 'README.md' -type f | sort); do
            # Extract body after the closing ---
            BODY=$(sed '1,/^---$/d' "$f" | sed '1,/^---$/d' | sed '/^$/d')
            if [ -n "$BODY" ]; then
              NOTES="${NOTES}- ${BODY}\n"
            fi
          done

          if [ -z "$NOTES" ]; then
            NOTES="- Version bump (${BUMP})"
          fi

          # Write multiline output
          {
            echo "notes<<NOTES_EOF"
            echo -e "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Remove consumed changesets
        if: steps.changesets.outputs.found == 'true'
        run: |
          find .changeset -name '*.md' ! -name 'README.md' -type f -delete

      - name: Commit version bump
        if: steps.changesets.outputs.found == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION extension/manifest.json .changeset/
          git commit -m "release: v${VERSION}"
          git push

      - name: Package extension
        if: steps.changesets.outputs.found == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd extension
          zip -r "../dom-hints-v${VERSION}.zip" . -x '.*'

      - name: Create GitHub release
        if: steps.changesets.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "dom-hints-v${VERSION}.zip" \
            --title "v${VERSION}" \
            --notes "${{ steps.notes.outputs.notes }}"
